version: v2
managed:
  enabled: true
  go_package_prefix:
    default: github.com/yourorg/my-grpc-service/gen/go
inputs:
  - directory: proto
plugins:
  # Go plugins
  - remote: buf.build/protocolbuffers/go:v1.31.0
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.3.0
    out: gen/go
    opt:
      - paths=source_relative

  # Java plugins
  - remote: buf.build/protocolbuffers/java:v32.1
    out: gen/java
  - remote: buf.build/grpc/java:v1.58.0
    out: gen/java