syntax = "proto3";

package acme.greeter.v1;

option go_package = "github.com/yourorg/my-grpc-service/gen/go/acme/greeter/v1";
option java_package = "com.yourorg.acme.greeter.v1";
option java_multiple_files = true;
option java_outer_classname = "GreeterServiceProto";

service GreeterService {
  rpc SayHello(SayHelloRequest) returns (SayHelloResponse);
  rpc SayGoodbye(SayGoodbyeRequest) returns (SayGoodbyeResponse);
}

message SayHelloRequest {
  string name = 1;
  string greeting = 2;
}

message SayHelloResponse {
  string message = 1;
  int64 timestamp = 2;
}

message SayGoodbyeRequest {
  string name = 1;
}

message SayGoodbyeResponse {
  string farewell = 1;
}